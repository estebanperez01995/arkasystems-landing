<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Arka Systems logo">
  <defs>
    <linearGradient id="arkaAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8b26b"/>
      <stop offset="100%" stop-color="#c89255"/>
    </linearGradient>
    <radialGradient id="arkaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b26b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e8b26b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft glow halo -->
  <circle cx="50" cy="50" r="46" fill="url(#arkaGlow)"/>

  <!-- Connecting curves forming the A silhouette -->
  <g stroke="url(#arkaAmber)" stroke-linecap="round" fill="none">
    <path d="M 50 24 C 44 38, 32 54, 24 70" stroke-width="7"/>
    <path d="M 50 24 C 56 38, 68 54, 76 70" stroke-width="7"/>
    <path d="M 32 60 Q 50 53, 68 60" stroke-width="6"/>
  </g>

  <!-- Nodes -->
  <g fill="url(#arkaAmber)">
    <circle cx="50" cy="24" r="9"/>
    <circle cx="24" cy="70" r="9"/>
    <circle cx="76" cy="70" r="9"/>
    <circle cx="62" cy="56" r="5"/>
  </g>
</svg>
